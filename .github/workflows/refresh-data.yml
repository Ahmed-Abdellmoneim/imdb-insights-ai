name: Refresh data

# Daily: restore the API cache, re-fetch what is new or expired, publish the warehouse.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    # Skip (rather than fail nightly) until the Hugging Face dataset is configured.
    if: vars.HF_DATASET_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120  # the first run embeds every review; later runs only new ones
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked --no-dev

      - name: Restore API cache
        run: uv run python -m imdb_insights.publish pull-cache

      - name: Ingest
        # Exit code 3 means "partial: some IMDb ratings must wait for tomorrow's quota".
        # That is still worth publishing; any other failure stops the job.
        run: |
          set +e
          uv run python -m imdb_insights.ingest
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Publish
        run: uv run python -m imdb_insights.publish push
