[project]
name = "imdb-insights"
version = "2.0.0.dev0"
description = "IMDb Top 250 data pipeline and AI insights: API ingestion, NLP over reviews, and a RAG assistant."
readme = "README.md"
authors = [
    { name = "Ahmed Abdelmoneim", email = "ahmed.abdellmoneim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "onnxruntime>=1.31.0",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.65.0",
    "tokenizers>=0.23.3",
    "typer>=0.27.3",
]

[project.scripts]
imdb-ingest = "imdb_insights.ingest.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
# Model training and evaluation (step 3). Not installed by default, so CI, the app and
# Streamlit Cloud stay light: `uv sync --group ml`.
ml = [
    "scikit-learn",
    "torch",
    "transformers",
    "sentence-transformers",
]

[tool.uv]
default-groups = ["dev"]
# Windows Smart App Control blocks DLLs from very new releases until they gain reputation.
# These Windows-only caps keep local development working; Linux (CI, deployment) is free.
constraint-dependencies = [
    "scipy<1.18; sys_platform == 'win32'",
    "regex<2026.9; sys_platform == 'win32'",
]

# CUDA 12.6 builds of PyTorch still support older GPUs (e.g. Pascal, compute 6.1).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
